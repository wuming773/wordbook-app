<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123d78">
<title>六级英语单词书</title>
<style>
:root {
  --bg: #f4f1e9;
  --paper: #fffdf8;
  --ink: #1f2937;
  --muted: #6b7280;
  --line: #e2dccf;
  --blue: #2457c5;
  --blue-2: #3b82f6;
  --blue-soft: #eaf0ff;
  --coral: #d95645;
  --coral-soft: #fdeeea;
  --green: #2f7d4a;
  --green-soft: #e9f7ee;
  --gold: #b7791f;
  --shadow: 0 12px 30px rgba(20, 30, 60, .07);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f141c;
    --paper: #171e29;
    --ink: #eef2f7;
    --muted: #9aa7b8;
    --line: #2b3544;
    --blue: #7aa2ff;
    --blue-2: #60a5fa;
    --blue-soft: #1a2b4d;
    --coral: #ff8b78;
    --coral-soft: #3a1f1b;
    --green: #7fd39a;
    --green-soft: #173323;
    --gold: #f1c46b;
    --shadow: 0 12px 30px rgba(0, 0, 0, .28);
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  line-height: 1.6;
}
button, input, select { font: inherit; }
button {
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  border-radius: 10px;
  padding: 8px 13px;
  transition: .18s ease;
}
button:hover { border-color: var(--blue); color: var(--blue); }
button:disabled { cursor: default; opacity: .48; }
.hidden { display: none !important; }

/* header */
.app-header {
  background:
    radial-gradient(900px 280px at 80% -20%, rgba(122, 162, 255, .5), transparent 60%),
    linear-gradient(135deg, #0c2340 0%, #123d78 48%, #5b2a86 100%);
  color: #fff;
  border-bottom: 1px solid rgba(255, 255, 255, .15);
}
.header-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 25px 22px 18px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand-mark {
  width: 46px; height: 46px; flex: none;
  display: grid; place-items: center;
  border-radius: 14px;
  background: rgba(255, 255, 255, .16);
  border: 1px solid rgba(255, 255, 255, .26);
  font-size: 23px; font-weight: 800;
}
.brand h1 { margin: 0; font-size: 27px; line-height: 1.15; letter-spacing: .01em; }
.brand p { margin: 3px 0 0; font-size: 12.5px; color: #c9d8f5; }
.header-stats { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
.header-stat {
  background: rgba(255, 255, 255, .1);
  border: 1px solid rgba(255, 255, 255, .19);
  border-radius: 11px;
  padding: 6px 10px;
  font-size: 11.5px;
  color: #dbe7ff;
  white-space: nowrap;
}
.header-stat b { color: #fff; font-size: 17px; margin-right: 3px; }
button.header-stat { font: inherit; cursor: pointer; }
button.header-stat.off { opacity: .55; }
.tabbar {
  max-width: 1180px;
  margin: 0 auto;
  padding: 0 22px;
  display: flex;
  gap: 4px;
  overflow-x: auto;
}
.tab {
  border: 0;
  border-bottom: 3px solid transparent;
  border-radius: 8px 8px 0 0;
  background: transparent;
  color: #c3d5f5;
  padding: 10px 13px 11px;
  font-size: 13.5px;
  font-weight: 700;
  white-space: nowrap;
}
.tab:hover { color: #fff; border-bottom-color: rgba(255, 255, 255, .35); }
.tab.active { color: #fff; border-bottom-color: #9fbcff; background: rgba(255, 255, 255, .08); }
.tab .tab-count {
  display: inline-block;
  min-width: 18px;
  padding: 0 5px;
  margin-left: 4px;
  border-radius: 99px;
  background: rgba(255, 255, 255, .16);
  font-size: 10.5px;
  line-height: 18px;
  text-align: center;
}
.tab.active .tab-count { background: #9fbcff; color: #123d78; }

/* layout */
.app-main { max-width: 1180px; margin: 0 auto; padding: 26px 22px 80px; }
.view { display: none; }
.view.active { display: block; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin: 0 0 16px; }
.page-head h2 { margin: 0; font-size: 23px; }
.page-head p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 24px 0 10px; }
.section-title h3 { margin: 0; font-size: 17px; }
.section-title span { color: var(--muted); font-size: 12px; }
.empty-state {
  border: 1px dashed var(--line);
  border-radius: 14px;
  padding: 34px 18px;
  text-align: center;
  color: var(--muted);
  background: var(--paper);
}
.empty-state b { display: block; color: var(--ink); margin-bottom: 4px; }
.hint { color: var(--muted); font-size: 12px; margin: 12px 0 0; }

/* summary */
.summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.summary-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 14px 16px;
  box-shadow: var(--shadow);
}
.summary-card span { display: block; font-size: 11.5px; color: var(--muted); }
.summary-card b { display: block; font-size: 27px; line-height: 1.2; margin-top: 2px; }
.summary-card small { color: var(--muted); font-size: 11.5px; }

/* catalog */
.unit-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.unit-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: 16px;
  box-shadow: var(--shadow);
}
.unit-head { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; }
.unit-no {
  width: 38px; height: 38px; flex: none;
  display: grid; place-items: center;
  border-radius: 11px;
  background: var(--blue-soft);
  color: var(--blue);
  font-weight: 800;
  font-size: 15px;
}
.unit-head h3 { margin: 0; font-size: 17px; }
.unit-head p { margin: 1px 0 0; font-size: 11.5px; color: var(--muted); }
.lesson-list { display: grid; gap: 6px; }
.lesson-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%;
  border: 1px solid transparent;
  border-radius: 10px;
  padding: 8px 9px;
  background: var(--bg);
  color: var(--ink);
  text-align: left;
  font-size: 13px;
}
.lesson-row.ready:hover { border-color: var(--blue); background: var(--blue-soft); }
.lesson-row .lesson-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lesson-row .lesson-meta { flex: none; font-size: 11px; color: var(--muted); }
.lesson-row.ready .lesson-meta { color: var(--blue); font-weight: 700; }
.lesson-row.empty { color: var(--muted); background: transparent; border-color: var(--line); border-style: dashed; }
.lesson-row.empty .lesson-meta { color: var(--muted); }
.lesson-progress { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-top: 5px; }
.lesson-progress i { display: block; height: 100%; background: var(--blue); border-radius: 99px; }

/* lesson */
.breadcrumb { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 12.5px; margin-bottom: 9px; }
.breadcrumb button { padding: 2px 0; border: 0; background: transparent; color: var(--blue); }
.lesson-head {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: 17px 19px;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
}
.lesson-head h2 { margin: 0; font-size: 25px; }
.lesson-head p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
.group-chips { display: flex; gap: 7px; flex-wrap: wrap; margin: 13px 0 0; }
.group-chip { border-radius: 99px; padding: 4px 10px; font-size: 11.5px; font-weight: 700; background: var(--bg); color: var(--muted); }
.group-chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.group-chip.coral.active { background: var(--coral); border-color: var(--coral); }
.word-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
.word-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-left: 4px solid var(--blue);
  border-radius: 16px;
  padding: 14px 16px 12px;
  box-shadow: var(--shadow);
  transition: .18s ease;
}
.word-card.coral { border-left-color: var(--coral); }
.word-card.mastered { opacity: .58; }
.word-card.wrong { border-left-color: var(--coral); }
.word-head { display: flex; align-items: flex-start; gap: 9px; }
.word-no { font-size: 11px; font-weight: 800; color: var(--muted); background: var(--bg); border-radius: 6px; padding: 1px 5px; margin-top: 4px; }
.word-main { flex: 1; min-width: 0; }
.word-main h3 { margin: 0; font-size: 25px; line-height: 1.1; letter-spacing: .01em; }
.icon-btn { width: 30px; height: 30px; flex: none; padding: 0; border-radius: 50%; font-size: 14px; line-height: 1; color: var(--muted); background: transparent; }
.icon-btn:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
.review-speak { display: inline-flex; align-items: center; justify-content: center; gap: 3px; width: auto; padding: 0 7px; border-radius: 15px; }
.review-speak .key-hint { margin-left: 0; padding: 0 3px; font-size: 9px; }
.star.on { color: #fff; background: var(--gold); border-color: var(--gold); }
.word-fold { margin-top: 7px; }
.word-fold > summary {
  list-style: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: 9px;
  padding: 6px 9px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 700;
}
.word-fold > summary::-webkit-details-marker { display: none; }
.word-fold > summary:hover { border-color: var(--blue); color: var(--blue); }
.word-fold[open] > summary { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); border-radius: 8px 8px 0 0; }
.word-card.coral .word-fold[open] > summary { background: var(--coral-soft); border-color: var(--coral); color: var(--coral); }
.fold-arrow { transition: transform .18s; }
.word-fold[open] .fold-arrow { transform: rotate(180deg); }
.card-body { padding: 10px 10px 4px; border: 1px solid var(--blue); border-top: 0; border-radius: 0 0 8px 8px; background: var(--paper); }
.word-card.coral .card-body { border-color: var(--coral); }
.phonetic-line { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin: 0 0 7px; }
.phonetic { color: var(--blue); font-family: "Lucida Sans Unicode", "Segoe UI", sans-serif; font-size: 12.5px; }
.word-card.coral .phonetic { color: var(--coral); }
.pos { color: var(--muted); font-size: 11.5px; font-weight: 700; }
.label { display: inline-block; font-size: 10px; letter-spacing: .07em; color: var(--muted); text-transform: uppercase; font-weight: 800; margin-bottom: 2px; }
.meaning p, .memory p { margin: 0 0 7px; }
.meaning p { font-size: 14.5px; font-weight: 650; }
.memory { padding-top: 7px; border-top: 1px dashed var(--line); }
.memory p { font-size: 13px; }
.derivatives { padding-top: 7px; border-top: 1px dashed var(--line); margin-top: 7px; }
.deriv-list { display: flex; flex-wrap: wrap; gap: 5px; }
.deriv { display: inline-flex; align-items: baseline; gap: 3px; padding: 2px 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--muted); font-size: 11.5px; }
.deriv b { color: var(--ink); }
.deriv small { color: var(--blue); font-size: 10.5px; }
.deriv em { font-style: normal; font-size: 10px; border-left: 1px solid var(--line); padding-left: 3px; }
.word-foot { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 8px; padding-top: 7px; border-top: 1px dashed var(--line); }
.review-chip { border-radius: 99px; padding: 2px 8px; font-size: 10.5px; font-weight: 700; background: var(--bg); color: var(--muted); }
.review-chip.due { background: var(--coral-soft); border-color: var(--coral); color: var(--coral); }
.review-chip.done { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.cycle-text { font-size: 10.5px; color: var(--muted); }

/* review page */
.review-hero {
  background: linear-gradient(135deg, var(--blue-soft), transparent 75%);
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: 18px 19px;
  display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap;
  margin-bottom: 16px;
}
.review-hero h2 { margin: 0 0 4px; font-size: 20px; }
.review-hero p { margin: 0; color: var(--muted); font-size: 12.5px; }
.review-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.review-controls select { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.review-controls button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.review-controls button.primary:hover { background: var(--blue-2); color: #fff; }
.word-card.highlight { outline: 3px solid var(--blue); outline-offset: 2px; }
.review-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.review-stat { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px; }
.review-stat span { display: block; font-size: 11.5px; color: var(--muted); }
.review-stat b { display: block; font-size: 25px; margin-top: 2px; }

/* search */
.search-box { display: flex; gap: 8px; margin: 0 0 14px; }
.search-box input {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 11px 13px;
  background: var(--paper);
  color: var(--ink);
  outline: none;
}
.search-box input:focus { border-color: var(--blue); }
.search-results { display: grid; gap: 8px; }
.search-row {
  display: flex; align-items: center; gap: 12px; justify-content: space-between;
  width: 100%; text-align: left;
  background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px;
}
.search-row:hover { border-color: var(--blue); }
.search-row .sr-main { min-width: 0; }
.search-row .sr-word { font-weight: 800; font-size: 16px; }
.search-row .sr-meta { color: var(--muted); font-size: 11.5px; }
.search-row .sr-meaning { color: var(--ink); font-size: 12.5px; margin-top: 2px; }
.search-row .sr-lesson { flex: none; color: var(--muted); font-size: 11px; text-align: right; }
.wrong-list { display: grid; gap: 8px; }

/* modal */
.modal {
  position: fixed; inset: 0; z-index: 80;
  display: none; align-items: center; justify-content: center; padding: 18px;
  background: rgba(8, 17, 32, .58);
}
.modal.open { display: flex; }
.modal-card {
  width: min(860px, 96vw);
  max-height: calc(100vh - 28px);
  overflow: auto;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 26px;
  padding: 34px 40px 40px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, .36);
  text-align: center;
}
.modal-word { display: flex; align-items: center; justify-content: center; gap: 12px; }
.modal-word h2 { margin: 0; font-size: 56px; letter-spacing: .01em; }
.review-word-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.review-arrow { flex: 0 0 auto; width: 46px; height: 46px; padding: 0; border-radius: 50%; font-size: 24px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
.review-arrow:disabled { opacity: .25; cursor: default; }
.review-progress { color: var(--muted); font-size: 15px; margin-top: 8px; }
.modal-answer { display: none; text-align: left; margin-top: 26px; }
.modal-answer.show { display: block; }
.modal-answer p { margin: 10px 0; font-size: 19px; line-height: 1.7; }
.modal-answer .phonetic-line { font-size: 18px; }
.modal-answer .meaning { font-size: 26px; font-weight: 800; line-height: 1.5; }
.modal-answer .memory {
  font-size: 19px;
  line-height: 1.7;
  padding: 12px 16px;
  margin-top: 14px;
  background: var(--blue-soft);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.modal-answer .memory b { color: var(--blue); }
.modal-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
.modal-actions button { font-size: 18px; padding: 12px 22px; }
.key-hint { margin-left: 6px; padding: 1px 5px; border: 1px solid currentColor; border-radius: 4px; font-size: 10px; font-weight: 400; opacity: .62; vertical-align: 1px; }
.modal-actions button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.modal-actions button.primary:hover { background: var(--blue-2); }
.modal-actions button.danger { background: var(--coral); border-color: var(--coral); color: #fff; }
.modal-actions button.danger:hover { opacity: .88; }

/* stats */
.stat-unit { background: var(--paper); border: 1px solid var(--line); border-radius: 13px; padding: 12px 14px; margin-bottom: 8px; }
.stat-unit-head { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 700; }
.stat-unit-bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 7px; }
.stat-unit-bar i { display: block; height: 100%; background: var(--blue); }
.stat-unit small { color: var(--muted); font-size: 11px; }

@media (max-width: 900px) {
  .summary-grid, .review-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .header-inner { padding-top: 20px; }
  .brand h1 { font-size: 23px; }
  .brand p { font-size: 11.5px; }
  .unit-grid, .word-grid { grid-template-columns: 1fr; }
  .app-main { padding: 20px 14px 60px; }
  .tabbar { padding: 0 14px; }
  .tab { padding: 9px 10px; font-size: 12.5px; }
  .summary-grid, .review-stats { gap: 8px; }
  .summary-card b, .review-stat b { font-size: 23px; }
  .word-main h3 { font-size: 23px; }
  .modal { padding: 8px; }
  .modal-card { width: 100%; max-height: calc(100vh - 16px); padding: 24px 18px 28px; border-radius: 20px; }
  .modal-word h2 { font-size: 44px; }
  .review-progress { font-size: 14px; }
  .modal-answer .meaning { font-size: 23px; }
  .modal-answer p { font-size: 17px; }
  .modal-answer .memory { font-size: 17px; padding: 10px 13px; }
}

</style>
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">词</div>
      <div><h1>六级英语单词书</h1><p>分单元学习 · 全局复习 · 遗忘曲线</p></div>
    </div>
    <div class="header-stats">
      <span class="header-stat"><b id="statTotal">0</b>总词数</span>
      <span class="header-stat"><b id="statMastered">0</b>已掌握</span>
      <span class="header-stat"><b id="statDue">0</b>今日待复习</span>
      <button type="button" class="header-stat" id="autoSpeakToggle" data-action="toggle-autospeak" aria-pressed="true">🔊 自动发音：开</button>
    </div>
  </div>
  <nav class="tabbar">
    <button type="button" class="tab active" data-action="tab" data-view="catalog">目录</button>
    <button type="button" class="tab" data-action="tab" data-view="review">今日复习 <span class="tab-count" id="tabDue">0</span></button>
    <button type="button" class="tab" data-action="tab" data-view="search">搜索</button>
    <button type="button" class="tab" data-action="tab" data-view="wrong">错词本</button>
    <button type="button" class="tab" data-action="tab" data-view="stats">统计</button>
  </nav>
</header>
<main class="app-main">
  <section class="view active" id="view-catalog"><div id="catalogContent"></div></section>
  <section class="view" id="view-lesson"><div id="lessonContent"></div></section>
  <section class="view" id="view-review"><div id="reviewContent"></div></section>
  <section class="view" id="view-search">
    <div class="page-head"><div><h2>搜索单词</h2><p>跨全部已添加课程搜索英文、中文释义、记忆法或派生词。</p></div></div>
    <div class="search-box"><input id="globalSearch" type="search" placeholder="输入单词或中文，例如 ambition / 雄心" autocomplete="off"></div>
    <div id="searchResults"></div>
  </section>
  <section class="view" id="view-wrong"><div id="wrongContent"></div></section>
  <section class="view" id="view-stats"><div id="statsContent"></div></section>
</main>
<div class="modal" id="reviewModal">
  <div class="modal-card">

  }

  const storageKey = 'wordbook-app-progress-v1';
  const autoSpeakKey = 'wordbook-app-autospeak';
  const reviewIntervals = [1, 2, 4, 7, 15, 30];
  let progress = loadProgress();
  let autoSpeak = (() => {
    try { return localStorage.getItem(autoSpeakKey) !== '0'; } catch (e) { return true; }
  })();
  let state = {
    view: 'catalog',
    currentLessonId: null,
    groupFilter: 'all',
    highlightId: null,
    reviewQueue: [],
    reviewPos: 0
  };

  function loadProgress() {
    try {
      const raw = localStorage.getItem(storageKey);
      return raw ? (JSON.parse(raw) || {}) : {};
    } catch (e) {
      return {};
    }
  }

  function saveProgress() {
    try { localStorage.setItem(storageKey, JSON.stringify(progress)); } catch (e) { /* ignore */ }
  }

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function rich(value) {
    return esc(value).replace(/&lt;u&gt;/g, '<u>').replace(/&lt;\/u&gt;/g, '</u>');
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  function dateStr(d) {
    const x = d || new Date();
    return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate());
  }

  function addDays(date, days) {
    const parts = date.split('-').map(Number);
    const d = new Date(parts[0], parts[1] - 1, parts[2]);
    d.setDate(d.getDate() + days);
    return dateStr(d);
  }

  function today() { return dateStr(new Date()); }

  function getState(id) { return progress[id] || null; }

  function dueCount(words) {
    const list = words || ALL_WORDS;
    return list.filter((w) => {
      const s = getState(w.id);
      return !s || !s.next || s.next <= today();
    }).length;
  }

  function newCount(words) {
    return (words || ALL_WORDS).filter((w) => !getState(w.id)).length;
  }

  function masteredCount() {
    return ALL_WORDS.filter((w) => getState(w.id) && getState(w.id).mastered).length;
  }

  function wrongWords() {
    return ALL_WORDS.filter((w) => {
      const s = getState(w.id);
      return s && s.wrong > 0;
    });
  }

  function reviewLabel(word) {
    const s = getState(word.id);
    if (!s || (!s.stage && !s.next)) return { text: '新词 · 点击开始', cls: 'due' };
    if (!s.next) return { text: '已巩固', cls: 'done' };
    if (s.next <= today()) return { text: '今日复习', cls: 'due' };
    return { text: '下次 ' + s.next.slice(5), cls: '' };
  }

  function cycleText(word) {
    const s = getState(word.id);
    if (!s || !s.stage) return '尚未开始';
    if (!s.next) return '6 / 6 轮完成';
    return '第 ' + (s.stage || 0) + ' / 6 轮';
  }

  function gradeWord(word, remembered) {
    const s = getState(word.id) || null;
    if (!remembered) {
      progress[word.id] = {
        stage: 0,
        start: today(),
        next: today(),
        last: today(),
        wrong: ((s && s.wrong) || 0) + 1,
        mastered: !!(s && s.mastered)
      };
    } else if (s && s.stage >= reviewIntervals.length && !s.next) {
      progress[word.id] = Object.assign({}, s, { last: today() });
    } else {
      const start = (s && s.start) || today();
      const stage = ((s && s.stage) || 0) + 1;
      progress[word.id] = {
        stage: stage,
        start: start,
        next: stage >= reviewIntervals.length ? null : addDays(start, reviewIntervals[stage - 1]),
        last: today(),
        wrong: (s && s.wrong) || 0,
        mastered: !!(s && s.mastered)
      };
    }
    saveProgress();
    updateAllCards();
    renderHeaderStats();
  }

  function toggleMastered(word) {
    const s = getState(word.id) || { stage: 0, start: null, next: null, last: null, wrong: 0 };
    s.mastered = !s.mastered;
    progress[word.id] = s;
    saveProgress();
    updateAllCards();
    renderHeaderStats();
  }

  let currentAudio = null;

  function audioKey(word) {
    return String(word || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }

  function speechFallback(word) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    const voices = window.speechSynthesis.getVoices();
    const voice = voices.find((v) => /^en-GB/i.test(v.lang)) || voices.find((v) => /^en/i.test(v.lang));
    u.lang = voice ? voice.lang : 'en-GB';
    u.rate = 0.84;
    if (voice) u.voice = voice;
    window.speechSynthesis.speak(u);
  }

  function speak(word) {
    const key = audioKey(word);
    if (!key) return;
    if (currentAudio) {
      try { currentAudio.pause(); } catch (e) { /* ignore */ }
      currentAudio = null;
    }

    // 本地音频优先：平板浏览器通常不支持或没有英文语音，但能播放 mp3/wav。
    // 离线单文件版会把 WAV 以 data URI 放在 __AUDIO_DATA__ 里，优先使用它。
    const audioSrc = (window.__AUDIO_DATA__ && window.__AUDIO_DATA__[key + '.wav'])
      || ('audio/' + encodeURIComponent(key) + '.wav');
    const local = new Audio(audioSrc);
    currentAudio = local;
    const playPromise = local.play();
    if (playPromise && playPromise.catch) {
      playPromise.catch(function () {
        // 本地音频不存在时，先试浏览器语音，再试在线词典发音。
        const voices = ('speechSynthesis' in window) ? window.speechSynthesis.getVoices() : [];
        if (voices.length) {
          speechFallback(word);
        } else {
          const online = new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=2');
          currentAudio = online;
          online.play().catch(function () { /* 无可用音频 */ });
        }
      });
    }
  }

  function maybeSpeak(word) {
    if (autoSpeak) speak(word);
  }

  function updateAutoSpeakButton() {
    const btn = document.getElementById('autoSpeakToggle');
    if (!btn) return;
    btn.textContent = autoSpeak ? '🔊 自动发音：开' : '🔇 自动发音：关';
    btn.classList.toggle('off', !autoSpeak);
    btn.setAttribute('aria-pressed', autoSpeak ? 'true' : 'false');
  }

  function toast(message) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      el.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#172033;color:#fff;padding:9px 15px;border-radius:10px;font-size:13px;z-index:100;box-shadow:0 8px 25px rgba(0,0,0,.25);opacity:0;transition:.2s';
      document.body.appendChild(el);
    }
    el.textContent = message;
    el.style.opacity = '1';
    clearTimeout(el._timer);
    el._timer = setTimeout(() => { el.style.opacity = '0'; }, 1800);
  }

  function renderHeaderStats() {
    const total = ALL_WORDS.length;
    const mastered = masteredCount();
    const due = dueCount();
    const set = (id, value) => {
      const el = document.getElementById(id);
      if (el) el.textContent = value;
    };
    set('statTotal', total);
    set('statMastered', mastered);
    set('statDue', due);
    set('tabDue', due);
    set('statRate', total ? Math.round(mastered / total * 100) + '%' : '0%');
  }

  function lessonInfo(lessonId) {
    return LESSON_BY_ID[lessonId] || null;
  }

  function renderCatalog() {
    const el = document.getElementById('catalogContent');
    if (!el) return;
    const unitCards = DATA.units.map((unit) => {
      const lessons = unit.lessons || [];
      const ready = lessons.filter((l) => l.status === 'ready');
      const words = [];
      for (const lesson of ready) words.push.apply(words, lesson.words || []);
      const mastered = words.filter((w) => getState(w.id) && getState(w.id).mastered).length;
      const due = dueCount(words);
      const lessonRows = lessons.map((lesson) => {
        if (lesson.status !== 'ready') {
          return '<button type="button" class="lesson-row empty" disabled><span class="lesson-name">Lesson ' + lesson.number + ' · 待添加</span><span class="lesson-meta">未添加</span></button>';
        }
        const lw = lesson.words || [];
        const lm = lw.filter((w) => getState(w.id) && getState(w.id).mastered).length;
        const pct = lw.length ? Math.round(lm / lw.length * 100) : 0;
        const extraTitle = lesson.title && !/^Lesson\s*\d+$/i.test(lesson.title) ? ' · ' + esc(lesson.title) : '';
        return '<button type="button" class="lesson-row ready" data-action="open-lesson" data-lesson-id="' + esc(lesson.id) + '">' +
          '<span class="lesson-name">Lesson ' + lesson.number + extraTitle + '</span>' +
          '<span class="lesson-meta">' + lw.length + ' 词 · ' + pct + '%</span>' +
          '</button>' +
          '<div class="lesson-progress"><i style="width:' + pct + '%"></i></div>';
      }).join('');
      return '<article class="unit-card">' +
        '<div class="unit-head"><span class="unit-no">' + pad(unit.number) + '</span><div><h3>' + esc(unit.title) + '</h3><p>' + ready.length + ' / ' + lessons.length + ' 节已添加 · ' + words.length + ' 词 · ' + due + ' 个待复习</p></div></div>' +
        '<div class="lesson-list">' + lessonRows + '</div>' +
        '</article>';
    }).join('');
    el.innerHTML =
      '<div class="summary-grid">' +
        '<div class="summary-card"><span>总词数</span><b>' + ALL_WORDS.length + '</b><small>已添加的课程</small></div>' +
        '<div class="summary-card"><span>已掌握</span><b>' + masteredCount() + '</b><small>点击 ☆ 标记</small></div>' +
        '<div class="summary-card"><span>今日待复习</span><b>' + dueCount() + '</b><small>遗忘曲线自动计算</small></div>' +
        '<div class="summary-card"><span>完成率</span><b>' + (ALL_WORDS.length ? Math.round(masteredCount() / ALL_WORDS.length * 100) : 0) + '%</b><small>已掌握 / 总词数</small></div>' +
      '</div>' +
      '<div class="section-title"><h3>课程目录</h3><span>共 ' + DATA.units.length + ' 个单元 · ' + DATA.units.reduce((n, u) => n + u.lessons.length, 0) + ' 节课</span></div>' +
      '<div class="unit-grid">' + unitCards + '</div>' +
      '<p class="hint">当前已添加 ' + DATA.units.reduce((n, u) => n + u.lessons.filter((l) => l.status === 'ready').length, 0) + ' 节课、' + ALL_WORDS.length + ' 个单词。以后把每节课的 JSON 放进 <code>app/data/units/unitXX/lessonYY.json</code>，再运行生成器即可更新目录。</p>';
  }

  function renderWordCard(word) {
    const group = word.group || '';
    const st = getState(word.id);
    const label = reviewLabel(word);
    const mastered = st && st.mastered;
    const derivatives = (word.derivatives || []).length
      ? '<div class="derivatives"><span class="label">派生 / 相关</span><div class="deriv-list">' +
        word.derivatives.map((d) => '<span class="deriv"><b>' + esc(d.word) + '</b> <small>' + esc(d.phonetic || '') + '</small> <em>' + esc(d.pos || '') + '</em> ' + rich(d.meaning || '') + '</span>').join('') +
        '</div></div>'
      : '';
    const memory = word.memory
      ? '<div class="memory"><span class="label">记忆</span><p>' + rich(word.memory) + '</p></div>'
      : '';
    return '<article class="word-card ' + esc(group) + (mastered ? ' mastered' : '') + '" data-word-id="' + esc(word.id) + '" data-group="' + esc(group) + '">' +
      '<div class="word-head">' +
        '<span class="word-no">' + pad(word.no) + '</span>' +
        '<div class="word-main"><h3>' + esc(word.word) + '</h3></div>' +
        '<button type="button" class="icon-btn" data-action="speak" data-word-id="' + esc(word.id) + '" title="朗读">🔊</button>' +
        '<button type="button" class="icon-btn star ' + (mastered ? 'on' : '') + '" data-action="master" data-word-id="' + esc(word.id) + '" title="标记已掌握">' + (mastered ? '★' : '☆') + '</button>' +
      '</div>' +
      '<details class="word-fold"><summary><span>音标 / 词性 / 中文含义</span><span class="fold-arrow">⌄</span></summary>' +
        '<div class="card-body">' +
          '<div class="phonetic-line"><span class="phonetic">' + esc(word.phonetic) + '</span><span class="pos">' + esc(word.pos) + '</span></div>' +
          '<div class="meaning"><span class="label">释义</span><p>' + rich(word.meaning) + '</p></div>' +
          memory +
          derivatives +
        '</div>' +
      '</details>' +
      '<div class="word-foot"><button type="button" class="review-chip ' + label.cls + '" data-action="review-word" data-word-id="' + esc(word.id) + '">' + esc(label.text) + '</button><span class="cycle-text">' + esc(cycleText(word)) + '</span></div>' +
      '</article>';
  }

  function renderLesson() {
    const lesson = lessonInfo(state.currentLessonId);
    const el = document.getElementById('lessonContent');
    if (!lesson || !el) return;
    const words = lesson.words || [];
    const groups = lesson.groups || [];
    const groupChips = '<button type="button" class="group-chip ' + (state.groupFilter === 'all' ? 'active' : '') + '" data-action="group-filter" data-group="all">全部 ' + words.length + '</button>' +
      groups.map((g) => {
        const count = words.filter((w) => w.group === g.id).length;
        return '<button type="button" class="group-chip ' + (g.color === 'coral' ? 'coral ' : '') + (state.groupFilter === g.id ? 'active' : '') + '" data-action="group-filter" data-group="' + esc(g.id) + '">' + esc(g.short || g.title) + ' ' + count + '</button>';
      }).join('');
    el.innerHTML =
      '<div class="breadcrumb"><button type="button" data-action="tab" data-view="catalog">目录</button><span>/</span><span>' + esc(lesson.unitTitle) + '</span><span>/</span><span>Lesson ' + lesson.number + ' · ' + esc(lesson.title) + '</span></div>' +
      '<div class="lesson-head"><div class="page-head"><div><h2>' + esc(lesson.title) + '</h2><p>' + esc(lesson.unitTitle) + ' · ' + words.length + ' 个单词 · 来源：' + esc(lesson.source || '') + '</p></div><div class="page-actions"><button type="button" data-action="start-lesson-review" data-lesson-id="' + esc(lesson.id) + '">复习本课</button><button type="button" data-action="tab" data-view="catalog">返回目录</button></div></div>' +
        '<div class="group-chips">' + groupChips + '</div></div>' +
      '<div class="word-grid" id="lessonWordGrid">' + words.filter((w) => state.groupFilter === 'all' || w.group === state.groupFilter).map(renderWordCard).join('') + '</div>' +
      (words.length ? '<p class="hint">点击单词下方「音标 / 词性 / 中文含义」展开；点 🔊 朗读；点 ☆ 标记已掌握；点「新词 / 今日复习」开始记忆周期。</p>' : '<div class="empty-state"><b>这节课还没有单词</b>把 JSON 数据放进 app/data/units/ 后重新生成即可。</div>');
    const grid = document.getElementById('lessonWordGrid');
    if (grid) {
      grid.querySelectorAll('.word-card').forEach((card) => {
        if (card.dataset.wordId === state.highlightId) {
          card.classList.add('highlight');
          setTimeout(() => { card.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 100);
          setTimeout(() => { card.classList.remove('highlight'); state.highlightId = null; }, 2200);
        }
      });
      grid.querySelectorAll('.word-fold').forEach((fold) => {
        fold.addEventListener('toggle', function () {
          if (!fold.open) return;
          const card = fold.closest('.word-card');
          const word = card ? WORD_BY_ID[card.dataset.wordId] : null;
          if (word) maybeSpeak(word.word);
        });
      });
    }
  }

  function openLesson(lessonId, highlightId) {
    state.currentLessonId = lessonId;
    state.groupFilter = 'all';
    state.highlightId = highlightId || null;
    switchView('lesson');
  }

  function renderReviewLanding() {
    const el = document.getElementById('reviewContent');
    if (!el) return;
    const units = DATA.units.filter((u) => u.lessons.some((l) => l.status === 'ready'));
    const options = '<option value="all">全部单元</option>' + units.map((u) => '<option value="unit' + pad(u.number) + '">' + esc(u.title) + '</option>').join('');
    el.innerHTML =
      '<div class="review-hero"><div><h2>今日复习</h2><p>从所有已添加的课程里，自动汇总今天到期的单词。不需要逐课打开。</p></div><div class="review-controls"><select id="reviewUnitFilter">' + options + '</select><button type="button" class="primary" data-action="start-review">开始今日复习</button></div></div>' +
      '<div class="review-stats"><div class="review-stat"><span>今日到期</span><b>' + dueCount() + '</b></div><div class="review-stat"><span>新词未学</span><b>' + newCount() + '</b></div><div class="review-stat"><span>已掌握</span><b>' + masteredCount() + '</b></div><div class="review-stat"><span>错词本</span><b>' + wrongWords().length + '</b></div></div>' +
      '<div class="section-title"><h3>记忆周期</h3><span>1 → 2 → 4 → 7 → 15 → 30 天</span></div>' +
      '<p class="hint">「记住了」进入下一轮；「忘记了」会回到今天重新开始，并自动加入错词本。每日复习量没有硬上限，可以按自己的时间分批完成。</p>';
  }

  function startReview(words, startWordId) {
    let list = (words || []).slice();
    if (!list.length) list = dueCount() ? ALL_WORDS.filter((w) => {
      const s = getState(w.id);
      return !s || !s.next || s.next <= today();
    }) : [];
    if (!list.length) {
      toast('今天没有到期单词，去学新词吧');
      return;
    }
    state.reviewQueue = list;
    const found = startWordId ? list.findIndex((w) => w.id === startWordId) : -1;
    state.reviewPos = found >= 0 ? found : 0;
    document.getElementById('reviewModal').classList.add('open');
    showReviewItem();
  }

  function startReviewByFilter() {
    const select = document.getElementById('reviewUnitFilter');
    const value = select ? select.value : 'all';
    let list = ALL_WORDS;
    if (value !== 'all') {
      const unitNo = Number(value.replace('unit', ''));
      list = ALL_WORDS.filter((w) => w.unitNumber === unitNo);
    }
    startReview(list.filter((w) => {
      const s = getState(w.id);
      return !s || !s.next || s.next <= today();
    }));
  }

  function showReviewItem() {
    const modal = document.getElementById('reviewModal');
    const wordEl = document.getElementById('reviewWord');
    const progressEl = document.getElementById('reviewProgress');
    const answer = document.getElementById('reviewAnswer');
    const showBtn = document.getElementById('reviewShow');
    const rememberBtn = document.getElementById('rememberBtn');
    const forgetBtn = document.getElementById('forgetBtn');
    if (!modal || !wordEl) return;
    answer.classList.remove('show');
    showBtn.classList.remove('hidden');
    rememberBtn.classList.add('hidden');
    forgetBtn.classList.add('hidden');
    if (state.reviewPos >= state.reviewQueue.length) {
      wordEl.textContent = '本轮复习完成 🎉';
      progressEl.textContent = '共复习 ' + state.reviewQueue.length + ' 个词';
      answer.innerHTML = '<p class="meaning">今天的记忆周期完成啦，继续保持。</p>';
      answer.classList.add('show');
      showBtn.classList.add('hidden');
      updateReviewNav();
      return;
    }
    const word = state.reviewQueue[state.reviewPos];
    const s = getState(word.id);
    wordEl.textContent = word.word;
    progressEl.textContent = '第 ' + (state.reviewPos + 1) + ' / ' + state.reviewQueue.length + ' 个 · ' + (s ? (s.stage || 0) + ' / 6 轮' : '新词');
    answer.innerHTML = '<div class="phonetic-line"><span class="phonetic">' + esc(word.phonetic) + '</span><span class="pos">' + esc(word.pos) + '</span></div><p class="meaning">' + rich(word.meaning) + '</p>' + (word.memory ? '<p class="memory"><b>记忆：</b>' + rich(word.memory) + '</p>' : '');
    updateReviewNav();
  }

  function updateReviewNav() {
    const prev = document.getElementById('reviewPrev');
    const next = document.getElementById('reviewNext');
    const total = state.reviewQueue.length;
    if (prev) prev.disabled = state.reviewPos <= 0;
    if (next) next.disabled = state.reviewPos >= total;
  }

  function moveReview(delta) {
    if (!state.reviewQueue.length) return;
    const nextPos = Math.max(0, Math.min(state.reviewQueue.length - 1, state.reviewPos + delta));
    if (nextPos === state.reviewPos) return;
    state.reviewPos = nextPos;
    showReviewItem();
  }

  function finishReviewStep(remembered) {
    if (state.reviewPos >= state.reviewQueue.length) return;
    const word = state.reviewQueue[state.reviewPos];
    gradeWord(word, remembered);
    state.reviewPos++;
    showReviewItem();
  }

  function renderSearch() {
    const input = document.getElementById('globalSearch');
    if (!input) return;
    renderSearchResults(input.value);
  }

  function renderSearchResults(query) {
    const el = document.getElementById('searchResults');
    if (!el) return;
    const q = String(query || '').trim().toLowerCase();
    if (!q) {
      el.innerHTML = '<div class="empty-state"><b>输入关键词开始搜索</b>可以搜英文单词、中文释义、记忆法或派生词。</div>';
      return;
    }
    const hits = ALL_WORDS.filter((w) => {
      const text = [w.word, w.phonetic, w.pos, w.meaning, w.memory].concat((w.derivatives || []).map((d) => d.word + ' ' + d.meaning)).join(' ').toLowerCase();
      return text.indexOf(q) >= 0;
    });
    if (!hits.length) {
      el.innerHTML = '<div class="empty-state"><b>没有找到</b>换个关键词试试。</div>';
      return;
    }
    const show = hits.slice(0, 250);
    el.innerHTML = '<div class="section-title"><h3>找到 ' + hits.length + ' 个词</h3><span>' + (hits.length > show.length ? '只显示前 ' + show.length + ' 个' : '') + '</span></div>' +
      '<div class="search-results">' + show.map((w) => '<button type="button" class="search-row" data-action="open-search-result" data-word-id="' + esc(w.id) + '">' +
        '<span class="sr-main"><span class="sr-word">' + esc(w.word) + '</span> <span class="sr-meta">' + esc(w.phonetic) + ' · ' + esc(w.pos) + '</span><span class="sr-meaning">' + rich(w.meaning) + '</span></span>' +
        '<span class="sr-lesson">' + esc(w.unitTitle) + '<br>Lesson ' + w.lessonNumber + ' · ' + esc(w.lessonTitle) + '</span></button>').join('') + '</div>';
  }

  function renderWrong() {
    const el = document.getElementById('wrongContent');
    if (!el) return;
    const words = wrongWords();
    if (!words.length) {
      el.innerHTML = '<div class="empty-state"><b>错词本是空的</b>复习时点「忘记了」，那个词会自动出现在这里。</div>';
      return;
    }
    el.innerHTML = '<div class="section-title"><h3>错词本</h3><span>' + words.length + ' 个词</span></div>' +
      '<div class="wrong-list">' + words.map((w) => {
        const s = getState(w.id);
        return '<div class="search-row"><span class="sr-main"><span class="sr-word">' + esc(w.word) + '</span> <span class="sr-meta">' + esc(w.phonetic) + ' · ' + esc(w.pos) + '</span><span class="sr-meaning">' + rich(w.meaning) + '</span></span><span class="sr-lesson">' + esc(w.unitTitle) + ' · Lesson ' + w.lessonNumber + '<br><small>忘记 ' + (s ? s.wrong : 0) + ' 次</small></span><button type="button" data-action="review-one" data-word-id="' + esc(w.id) + '">复习</button></div>';
      }).join('') + '</div>';
  }

  function renderStats() {
    const el = document.getElementById('statsContent');
    if (!el) return;
    const total = ALL_WORDS.length;
    const mastered = masteredCount();
    const started = ALL_WORDS.filter((w) => getState(w.id)).length;
    const wrong = wrongWords().length;
    const unitRows = DATA.units.map((unit) => {
      const words = [];
      for (const lesson of unit.lessons) if (lesson.status === 'ready') words.push.apply(words, lesson.words || []);
      const m = words.filter((w) => getState(w.id) && getState(w.id).mastered).length;
      const pct = words.length ? Math.round(m / words.length * 100) : 0;
      return '<div class="stat-unit"><div class="stat-unit-head"><span>' + esc(unit.title) + '</span><span>' + words.length + ' 词 · ' + m + ' 已掌握</span></div><div class="stat-unit-bar"><i style="width:' + pct + '%"></i></div><small>' + (words.length ? pct + '% 完成' : '还没有添加单词') + '</small></div>';
    }).join('');
    el.innerHTML = '<div class="summary-grid"><div class="summary-card"><span>总词数</span><b>' + total + '</b><small>已添加课程</small></div><div class="summary-card"><span>已开始学习</span><b>' + started + '</b><small>有复习记录</small></div><div class="summary-card"><span>已掌握</span><b>' + mastered + '</b><small>点击 ☆ 标记</small></div><div class="summary-card"><span>错词</span><b>' + wrong + '</b><small>忘记过的词</small></div></div>' +
      '<div class="section-title"><h3>各单元进度</h3><span>按已掌握比例计算</span></div>' + unitRows;
  }

  function switchView(view) {
    state.view = view;
    document.querySelectorAll('.view').forEach((el) => el.classList.toggle('active', el.id === 'view-' + view));
    document.querySelectorAll('.tab').forEach((el) => el.classList.toggle('active', el.dataset.view === view));
    if (view === 'catalog') renderCatalog();
    if (view === 'lesson') renderLesson();
    if (view === 'review') renderReviewLanding();
    if (view === 'search') { renderSearch(); setTimeout(() => { const i = document.getElementById('globalSearch'); if (i) i.focus(); }, 80); }
    if (view === 'wrong') renderWrong();
    if (view === 'stats') renderStats();
    renderHeaderStats();
  }

  function updateAllCards() {
    document.querySelectorAll('.word-card').forEach((card) => {
      const word = WORD_BY_ID[card.dataset.wordId];
      if (!word) return;
      const label = reviewLabel(word);
      const st = getState(word.id);
      const chip = card.querySelector('.review-chip');
      const cycle = card.querySelector('.cycle-text');
      const star = card.querySelector('.star');
      if (chip) { chip.textContent = label.text; chip.className = 'review-chip ' + label.cls; }
      if (cycle) cycle.textContent = cycleText(word);
      if (star) {
        const on = st && st.mastered;
        star.classList.toggle('on', !!on);
        star.textContent = on ? '★' : '☆';
        card.classList.toggle('mastered', !!on);
      }
    });
  }

  document.addEventListener('click', function (event) {
    const target = event.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    if (action === 'tab') {
      switchView(target.dataset.view);
      return;
    }
    if (action === 'open-lesson') {
      openLesson(target.dataset.lessonId);
      return;
    }
    if (action === 'group-filter') {
      state.groupFilter = target.dataset.group === 'all' || state.groupFilter === target.dataset.group ? 'all' : target.dataset.group;
      renderLesson();
      return;
    }
    if (action === 'speak') {
      const word = WORD_BY_ID[target.dataset.wordId];
      if (word) speak(word.word);
      return;
    }
    if (action === 'toggle-autospeak') {
      autoSpeak = !autoSpeak;
      try { localStorage.setItem(autoSpeakKey, autoSpeak ? '1' : '0'); } catch (e) { /* ignore */ }
      updateAutoSpeakButton();
      toast(autoSpeak ? '已开启：展开中文时自动发音' : '已关闭自动发音');
      return;
    }
    if (action === 'master') {
      const word = WORD_BY_ID[target.dataset.wordId];
      if (word) toggleMastered(word);
      return;
    }
    if (action === 'review-word') {
      const word = WORD_BY_ID[target.dataset.wordId];
      if (word) {
        const lesson = lessonInfo(word.lessonId);
        startReview(lesson ? lesson.words : [word], word.id);
      }
      return;
    }
    if (action === 'start-review') {
      startReviewByFilter();
      return;
    }
    if (action === 'start-lesson-review') {
      const lesson = lessonInfo(target.dataset.lessonId);
      if (lesson) startReview(lesson.words);
      return;
    }
    if (action === 'open-search-result') {
      const word = WORD_BY_ID[target.dataset.wordId];
      if (word) openLesson(word.lessonId, word.id);
      return;
    }
    if (action === 'review-one') {
      const word = WORD_BY_ID[target.dataset.wordId];
      if (word) {
        const lesson = lessonInfo(word.lessonId);
        startReview(lesson ? lesson.words : [word], word.id);
      }
    }
  });

  document.addEventListener('input', function (event) {
    if (event.target && event.target.id === 'globalSearch') renderSearchResults(event.target.value);
  });

  document.addEventListener('keydown', function (event) {
    const modal = document.getElementById('reviewModal');
    const isOpen = modal && modal.classList.contains('open');
    if (event.key === 'Escape' && isOpen) {
      modal.classList.remove('open');
      return;
    }
    if (!isOpen || event.repeat) return;
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    const tag = event.target && event.target.tagName ? event.target.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || (event.target && event.target.isContentEditable)) return;

    if (event.key === 'ArrowLeft') {
      event.preventDefault();
      moveReview(-1);
      return;
    }
    if (event.key === 'ArrowRight') {
      event.preventDefault();
      moveReview(1);
      return;
    }
    if (event.key === ' ' || event.key === 'Spacebar' || event.code === 'Space') {
      event.preventDefault();
      const showBtn = document.getElementById('reviewShow');
      if (showBtn && !showBtn.classList.contains('hidden')) showBtn.click();
      return;
    }
    const key = event.key.toLowerCase();
    if (key === 'r') {
      const speakBtn = document.getElementById('reviewSpeak');
      if (speakBtn) speakBtn.click();
      return;
    }
    if (key === 'q') {
      const rememberBtn = document.getElementById('rememberBtn');
      if (rememberBtn && !rememberBtn.classList.contains('hidden')) rememberBtn.click();
      return;
    }
    if (key === 'w') {
      const forgetBtn = document.getElementById('forgetBtn');
      if (forgetBtn && !forgetBtn.classList.contains('hidden')) forgetBtn.click();
    }
  });

  document.getElementById('reviewShow').addEventListener('click', function () {
    const answer = document.getElementById('reviewAnswer');
    const showBtn = document.getElementById('reviewShow');
    const rememberBtn = document.getElementById('rememberBtn');
    const forgetBtn = document.getElementById('forgetBtn');
    answer.classList.add('show');
    showBtn.classList.add('hidden');
    rememberBtn.classList.remove('hidden');
    forgetBtn.classList.remove('hidden');
    const word = state.reviewQueue[state.reviewPos];
    if (word) maybeSpeak(word.word);
  });
  document.getElementById('rememberBtn').addEventListener('click', function () { finishReviewStep(true); });
  document.getElementById('forgetBtn').addEventListener('click', function () { finishReviewStep(false); });
  document.getElementById('reviewClose').addEventListener('click', function () { document.getElementById('reviewModal').classList.remove('open'); });
  document.getElementById('reviewPrev').addEventListener('click', function () { moveReview(-1); });
  document.getElementById('reviewNext').addEventListener('click', function () { moveReview(1); });
  document.getElementById('reviewSpeak').addEventListener('click', function () {
    const word = state.reviewQueue[state.reviewPos];
    if (word) speak(word.word);
  });
  document.getElementById('reviewModal').addEventListener('click', function (event) {
    if (event.target === this) this.classList.remove('open');
  });

  updateAutoSpeakButton();
  renderHeaderStats();
  switchView('catalog');
})();

</script>
</body>
</html>
